[project]
name = "network-testing-validation-framework"
version = "1.0.0"
description = "Comprehensive Network & Web Application Automation Testing Framework"
authors = [
    { name = "Shiva Sathwik" }
]
readme = "README.md"
requires-python = ">=3.11"

[tool.black]
line-length = 88
target-version = ["py311"]
exclude = '''
(
  /(\.git|\.hg|\.mypy_cache|\.pytest_cache|\.tox|\.nox|\.venv|venv|\.venv311)/
)
'''

[tool.isort]
profile = "black"
line_length = 88
skip_gitignore = true
skip = [".venv", "venv", ".venv311", "__pycache__"]
